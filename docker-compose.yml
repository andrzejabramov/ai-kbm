version: "3.8"

services:
  kbm-sales-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbm_sales_agent
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - TZ=Europe/Moscow

    volumes:
      # База знаний монтируется как read-only — можно обновлять без пересборки
      - ./knowledge_base.json:/app/knowledge_base.json:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Ограничения ресурсов (важно для Proxmox VM)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

    networks:
      - kbm_network

networks:
  kbm_network:
    driver: bridge
    name: kbm_network
